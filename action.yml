name: 'MCP Conformance Tests'
description: 'Run MCP conformance tests against a server or client implementation'
inputs:
  mode:
    description: 'Test mode: "server" or "client"'
    required: true
  url:
    description: 'Server URL to test against (required for server mode)'
    required: false
  command:
    description: 'Command to run the client under test (required for client mode)'
    required: false
  expected-failures:
    description: 'Path to YAML file listing expected failures (baseline)'
    required: false
  suite:
    description: 'Test suite to run (server: "active"|"all"|"pending", client: "all"|"auth"|"metadata"|"sep-835")'
    required: false
  scenario:
    description: 'Run a single scenario by name'
    required: false
  timeout:
    description: 'Timeout in milliseconds for client tests (default: 30000)'
    required: false
    default: '30000'
  verbose:
    description: 'Show verbose output (default: false)'
    required: false
    default: 'false'
  node-version:
    description: 'Node.js version to use (default: 20)'
    required: false
    default: '20'
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build conformance tests
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$ACTION_PATH"
        npm ci
        npm run build

    - name: Run conformance tests
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_EXPECTED_FAILURES: ${{ inputs.expected-failures }}
        INPUT_SUITE: ${{ inputs.suite }}
        INPUT_SCENARIO: ${{ inputs.scenario }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
      run: |
        CONFORMANCE="$ACTION_PATH/dist/index.js"

        # Build the command arguments; each input is one argument
        ARGS=("$INPUT_MODE")

        # Mode-specific required options
        case "$INPUT_MODE" in
          server)
            if [ -z "$INPUT_URL" ]; then
              echo "::error::The 'url' input is required for server mode"
              exit 1
            fi
            ARGS+=(--url "$INPUT_URL")
            ;;
          client)
            if [ -z "$INPUT_COMMAND" ]; then
              echo "::error::The 'command' input is required for client mode"
              exit 1
            fi
            ARGS+=(--command "$INPUT_COMMAND")
            ;;
          *)
            echo "::error::Invalid mode '$INPUT_MODE'. Must be 'server' or 'client'."
            exit 2
            ;;
        esac

        # Optional arguments
        if [ -n "$INPUT_EXPECTED_FAILURES" ]; then
          ARGS+=(--expected-failures "$INPUT_EXPECTED_FAILURES")
        fi

        if [ -n "$INPUT_SUITE" ]; then
          ARGS+=(--suite "$INPUT_SUITE")
        fi

        if [ -n "$INPUT_SCENARIO" ]; then
          ARGS+=(--scenario "$INPUT_SCENARIO")
        fi

        if [ "$INPUT_MODE" = "client" ]; then
          case "$INPUT_TIMEOUT" in
            '' | *[!0-9]*)
              echo "::error::Invalid timeout '$INPUT_TIMEOUT'. Must be a number of milliseconds."
              exit 2
              ;;
          esac
          ARGS+=(--timeout "$INPUT_TIMEOUT")
        fi

        case "$INPUT_VERBOSE" in
          true)
            ARGS+=(--verbose)
            ;;
          false | '')
            ;;
          *)
            echo "::error::Invalid verbose '$INPUT_VERBOSE'. Must be 'true' or 'false'."
            exit 2
            ;;
        esac

        echo "Running: node $CONFORMANCE ${ARGS[*]}"
        node "$CONFORMANCE" "${ARGS[@]}"
